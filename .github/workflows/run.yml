{"name": "News Bot", "on": {"workflow_dispatch": {}, "schedule": [{"cron": "*/15 * * * *"}]}, "concurrency": {"group": "news", "cancel-in-progress": false}, "permissions": {"contents": "write", "actions": "write"}, "jobs": {"run": {"runs-on": "ubuntu-latest", "timeout-minutes": 10, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"run": "pip install requests"}, {"name": "Run", "run": "python -u news_bot.py", "env": {"TELEGRAM_TOKEN": "${{ secrets.TELEGRAM_TOKEN }}", "CHAT_ID": "${{ secrets.CHAT_ID }}"}}, {"name": "Save state", "if": "always()", "run": "git config user.name bot && git config user.email bot@users.noreply.github.com && git add state_news.json && (git commit -m state || true) && git pull --rebase && git push || true"}, {"name": "Next run", "if": "always()", "run": "gh workflow run news.yml", "env": {"GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}}]}}}
